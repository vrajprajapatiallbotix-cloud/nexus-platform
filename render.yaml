services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: nexus-redis
    plan: free
    ipAllowList: []

  # ── NestJS API ─────────────────────────────────────────────────────────────
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @nexus/database exec prisma generate && pnpm --filter @nexus/database exec prisma migrate deploy && pnpm --filter @nexus/api run build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        value: change-this-32char-production-key
      # Set this manually in Render dashboard after first API deploy:
      # CORS_ORIGINS = https://nexus-web.onrender.com

  # ── Next.js Web ────────────────────────────────────────────────────────────
  - type: web
    name: nexus-web
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @nexus/web run build
    startCommand: pnpm --filter @nexus/web run start
    envVars:
      - key: NODE_ENV
        value: production
      # After API deploys, update this to: https://nexus-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_URL
        value: https://nexus-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_WS_URL
        value: wss://nexus-api.onrender.com

databases:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - name: nexus-db
    plan: free
    databaseName: nexus_db
    user: nexus
