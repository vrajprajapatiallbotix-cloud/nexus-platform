services:
  # ── Redis ─────────────────────────────────────────
  - type: redis
    name: nexus-redis
    plan: free
    ipAllowList: []

  # ── NestJS API ────────────────────────────────────
  - type: web
    name: nexus-api
    runtime: node
    plan: free

    buildCommand: |
      npm install -g pnpm@9.1.0 &&
      pnpm install &&
      pnpm --filter @nexus/api run build

    preDeployCommand: |
      pnpm exec prisma migrate deploy --schema packages/database/prisma/schema.prisma

    startCommand: |
      node apps/api/dist/main.js

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ENCRYPTION_KEY
        value: 12345678901234567890123456789012

      - key: OPENAI_API_KEY
        value: optional-set-your-real-key-in-render-dashboard

      - key: ANTHROPIC_API_KEY
        value: optional-set-your-real-key-in-render-dashboard

  # ── Next.js Web ───────────────────────────────────
  - type: web
    name: nexus-web
    runtime: node
    plan: free

    buildCommand: |
      npm install -g pnpm@9.1.0 &&
      pnpm install --ignore-scripts &&
      pnpm --filter @nexus/web run build

    startCommand: |
      pnpm --filter @nexus/web run start

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_URL
        value: https://nexus-api.onrender.com/api/v1

      - key: NEXT_PUBLIC_WS_URL
        value: wss://nexus-api.onrender.com

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus_db
    user: nexus